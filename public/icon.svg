<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Background -->
  <rect width="512" height="512" rx="96" fill="#0b0f19"/>
  <!-- Green Flame Outer Circle Shape -->
  <g filter="url(#glow)">
    <path d="M 256,70 C 290,130 280,180 305,200 C 315,175 305,150 315,130 C 360,195 385,250 385,310 C 385,395 325,445 256,445 C 170,445 120,385 120,300 C 120,195 190,130 256,70 Z" fill="url(#flameGrad)" />
    <!-- Dark Inner Circle cutout for ring effect -->
    <circle cx="256" cy="315" r="95" fill="#0b0f19" />
    <!-- White Checkmark -->
    <path d="M 205,310 L 245,350 L 335,260" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Floating Green Heatmap Pixels -->
    <rect x="330" y="145" width="22" height="22" rx="4" fill="#84cc16" />
    <rect x="360" y="175" width="28" height="28" rx="6" fill="#22c55e" />
    <rect x="360" y="215" width="22" height="22" rx="4" fill="#16a34a" />
    <rect x="395" y="215" width="30" height="30" rx="6" fill="#84cc16" />
  </g>
</svg>
